; Supervisor program that keeps the Laravel scheduler running, so SportMonks data syncs by itself.
; `schedule:work` stays in the foreground and runs the scheduler every minute; the intervals of each
; sync are in config/sportmonks.php ("schedule") and can be overridden in .env.
;
; Install on the VPS (Ubuntu/Debian):
;   sudo apt install supervisor
;   sudo cp supervisor-scheduler.conf /etc/supervisor/conf.d/tmn-scheduler.conf
;   (edit the two paths and the user below to match this server)
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status tmn-scheduler
;
; After every deploy restart it, because `schedule:work` keeps the old code in memory:
;   sudo supervisorctl restart tmn-scheduler
;
; Run the scheduler from ONE place only. If this program is used, remove any cron entry or Coolify
; Scheduled Task that also runs `php artisan schedule:run`.

[program:tmn-scheduler]
process_name=%(program_name)s
command=php /var/www/tmn-backend/artisan schedule:work
directory=/var/www/tmn-backend
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/www/tmn-backend/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
