; Supervisor inside the Docker image (Coolify). It is started by the image's init (s6-overlay) next to
; nginx and php-fpm, and keeps the Laravel scheduler running so SportMonks data syncs by itself.
; Sync intervals are in config/sportmonks.php ("schedule") and can be overridden with
; SPORTMONKS_SCHEDULE_* environment variables in Coolify.
;
; Runs as the image's www-data user, so every file it writes is under /tmp. Output goes to stdout,
; which is what the Coolify "Logs" tab shows.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:tmn-scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
